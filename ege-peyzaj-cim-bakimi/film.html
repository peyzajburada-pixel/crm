//
// Contract used by tools/capture.mjs:
//   window.READY            Promise<{frames, fps, width, height, renderer, title, bounds, vo}>, resolves after fonts are
//                           loaded (bounds = scene starts + the end, for tools/make.py and the per-scene checks)
//   window.renderFrame(i)   draws frame i; a pure function of (i / FPS, SEED); nothing carried between frames
//   window.captureFrame(i)  renderFrame(i) + returns a PNG/JPEG data URL of the canvas
//   window.renderAudio()    Promise<AudioBuffer>: the whole soundtrack, rendered OFFLINE (OfflineAudioContext)
// URL params: w, h (default 1080x1920 = 9:16), seed, capture=1 (set by capture.mjs: no preview loop),
//             shutter=<samples> (0 = motion blur off, for drafts), weave=<px>, tone=0 (finishing overrides)
//
// Renders: python3 tools/make.py stills | draft | final (KIT/references/quick-mode.md §3-4). It captures, lays the
// narration on the score (audio/mix.json), masters to -14 LUFS and runs the checks; never chain capture.mjs,
// master_audio.py and qc.py by hand.
//
// Edit only the FILM section below: TITLE, PURPOSE, FINISH, DURATION, PALETTE, TYPE (roles, check), CUES, VO, SCENES, SFX, ROOM,
// ARRANGEMENT, the scene functions and score(). Helpers stay as they are: EASE, MOTION (at, back, anticipate, spring, stagger, arc), CAM (pan, tilt, dolly, zoom, truck, crane, orbit, dollyZoom,
// pushTo, fpv, handheld, matchFrom, rackFocus), retime() (speed ramp, slow motion, time-lapse, freeze), plane(),
// TRANSITION (dissolve, wipe, whip, iris), lazy() (seeded data built once), label() (on-screen names), and the sound voices.
// Seeded data (star fields, layouts) is built with lazy() and first used inside a draw call: SEED is set further down
// the file, so a top-level rng() call here would run before it.

// ============================== FILM ==============================

// CSS filter), bloom (highlight glow), texture ('paper' fibre, 'scanlines', 'halftone' dots), vignette, grain (and
// grainHold: frames per grain pattern; Infinity = static paper fibre), hold (drawings per second: 12 = on twos; sound,
// captions and the camera keep 24). Draw functions read line (outline width, share of the short side; 0 = none) and
// steps (toon light bands for shade(); 0 = smooth). palette is the family's starting PALETTE. A recipe from the style
// library (KIT/styles/<id>.md) starts from its base family here and adds its own grammar in the draw functions.
// ?look=<id> in the URL swaps the family for a preview (the director card's look line, quick-mode.md §2).
const LOOKS = {

const FORMULAS = {};

const TYPE = {

  roles: { display: { family: 'Alfa Slab One', files: { 400: 'fonts/alfa-400.woff2' } },

  // e.g. display: { family: 'Fraunces', pkg: 'fraunces', version: '5.3.0', variable: 'full',

  //      text: { family: 'Instrument Sans', pkg: 'instrument-sans', version: '5.3.0', weights: [400, 600] },
  //      mono: { family: 'IBM Plex Mono', pkg: 'ibm-plex-mono', version: '5.3.0', weights: [400], features: '"tnum"' },
  check: { strings: { display: [TITLE, 'Ege Peyzaj', '5 cm', '1234'], text: ['Biçme boyu 5 cm', 'Yağmurda sulamayı azalt', 'KAPALI', 'AÇIK'] }, sizes: { text: 0.04 } },
};

const VO = [];
const CAPTIONS = null;
const CAPTION_STYLE = { role: 'display', accentRole: 'display', size: 0.062, caps: false, ink: PALETTE.ink, hi: PALETTE.ink, accent: PALETTE.accent, punch: 0.07 };

const SCENES = [

  { from: CUES.s3, to: CUES.s4, draw: soilAerated, action: 'the aerator plugs the soil and seeds pour into the holes', in: { type: 'wipe', dur: 0.4, dir: 'up' }, amb: { kind: 'air', gain: 0.04 } },

  { at: CUES.s3 + 2.3, voice: 'foley', kind: 'cloth', gain: 0.35, wet: 0.15 },       // the seeds pour

const ROOM = { secs: 1.6, decay: 3.0, tone: 5200 };

  { section: 'rain', from: CUES.s5, to: CUES.s6, parts: ['bass'] },

// ---------- the film's own drawing kit (mid-century print: off-register cels, broken breathing ink) ----------
const twos = (t) => Math.floor(t * 12) / 12;                       // drawings change on twos
const world = (g, S) => g.setTransform(S.u, 0, 0, S.u, S.W / 2, S.H / 2);
const HH = () => S.H / S.u / 2;                                     // half frame height in world units (0.889 at 9:16)
function jit(t, salt, a = 0.0022) { const r = rng(salt * 977 + Math.round(twos(t) * 12)); return [(r() - 0.5) * a, (r() - 0.5) * a]; }
// a fill printed a little down-right of its line, the offset re-rolled on twos
function cel(g, t, salt, path, fill, alpha = 1) {
  const j = jit(t, salt); g.save(); g.translate(0.0035 + j[0], 0.0035 + j[1]);
  g.beginPath(); path(g); g.globalAlpha = alpha; g.fillStyle = fill; g.fill(); g.restore();
}
// a broken ink line whose width breathes on twos
function inked(g, t, salt, path, w = 0.0032, color = PALETTE.ink) {
  const r = rng(salt * 131 + Math.round(twos(t) * 12));
  g.save(); g.beginPath(); path(g); g.lineWidth = w * (0.8 + 0.4 * r()); g.strokeStyle = color; g.lineCap = 'round'; g.lineJoin = 'round';
  g.setLineDash([0.07 + 0.03 * hash1(salt), 0.007, 0.03, 0.005 + 0.004 * r()]); g.lineDashOffset = hash1(salt + 7) * 0.1;
  g.stroke(); g.restore();
}
// the sun sits upper left: every object drops a copy of itself down-right
function dropShadow(g, path, dx = 0.012, dy = 0.016, a = 0.22) {
  g.save(); g.translate(dx, dy); g.beginPath(); path(g); g.fillStyle = `rgba(70,52,30,${a})`; g.fill(); g.restore();
}
const rr = (x, y, w, h, r) => (g) => g.roundRect(x, y, w, h, r);
const disc = (x, y, r) => (g) => g.arc(x, y, r, 0, TAU);
function mixHex(a, b, k) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)), A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(k))).toString(16).padStart(2, '0')).join('');
}
// a number medallion: ink disc, mustard plate offset, a slab numeral; pops in with a back ease
function medallion(g, t, x, y, r, n, k) {
  if (k <= 0) return; const s = MOTION.back(clamp(k), 2.2);
  g.save(); g.translate(x, y); g.scale(s, s);
  dropShadow(g, disc(0, 0, r), 0.006, 0.008, 0.25);
  cel(g, t, 40 + n, disc(0, 0, r), PALETTE.mustard);
  inked(g, t, 41 + n, disc(0, 0, r * 0.98), r * 0.09);
  inked(g, t, 42 + n, disc(0, 0, r * 0.78), r * 0.035);
  text(g, S, String(n), 0, 0, r * 1.05, PALETTE.ink, 1, 0, { role: 'display', weight: 400 });
  g.restore();
}
// a paper tag with a star bullet, popping beside the action
function tag(g, t, str, x, y, size, k, salt = 60) {
  if (k <= 0) return; const s = MOTION.back(clamp(k), 1.7);
  g.save(); g.translate(x, y + (1 - clamp(k * 1.4)) * 0.02); g.scale(s, s);
  setType(g, TYPE, 'text', size * 100, { short: 100, weight: 600 });
  const w = g.measureText(str).width / 100 + size * 2.2, h = size * 1.9;
  dropShadow(g, rr(-w / 2, -h / 2, w, h, h * 0.3), 0.006, 0.008, 0.2);
  cel(g, t, salt, rr(-w / 2, -h / 2, w, h, h * 0.3), '#FBF6EA');
  inked(g, t, salt + 1, rr(-w / 2, -h / 2, w, h, h * 0.3), 0.0026);
  star4(g, -w / 2 + size * 0.75, 0, size * 0.32, PALETTE.terra, t * 2);
  g.save(); g.scale(0.01, 0.01); g.fillStyle = PALETTE.ink; g.textAlign = 'center'; g.textBaseline = 'middle';
  setType(g, TYPE, 'text', size * 100, { short: 100, weight: 600 }); g.fillText(str, size * 0.35 * 100, size * 0.06 * 100); g.restore();
  g.restore();
}
function star4(g, x, y, r, color, spin = 0) {
  g.save(); g.translate(x, y); g.rotate(spin); g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, q = i % 2 ? r * 0.28 : r; g.lineTo(Math.cos(a) * q, Math.sin(a) * q); }
  g.closePath(); g.fillStyle = color; g.fill(); g.restore();
}
function paperGround(g, S, color) { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = color; g.fillRect(0, 0, S.W, S.H); g.restore(); }

// ---------- the villa plan (world units, plan origin = the lawn's centre) ----------
const TRAIL_PTS = [[-0.27, -0.25], [0.0, -0.23], [0.27, -0.17], [0.32, -0.02], [0.12, 0.07], [-0.2, 0.12], [-0.33, 0.27],
  [-0.12, 0.37], [0.2, 0.42], [0.31, 0.56], [0.12, 0.66], [0.0, 0.74], [0.0, 0.83]];
// the trail as a dense polyline with its arc length, Catmull-Rom through the points
const TRAIL = lazy(() => {
  const P = TRAIL_PTS, out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let j = 0; j < 40; j++) {
      const u = j / 40, u2 = u * u, u3 = u2 * u;
      out.push([0, 1].map((d) => 0.5 * (2 * p1[d] + (-p0[d] + p2[d]) * u + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * u2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * u3)));
    }
  }
  out.push(P[P.length - 1]);
  const L = [0]; for (let i = 1; i < out.length; i++) L.push(L[i - 1] + Math.hypot(out[i][0] - out[i - 1][0], out[i][1] - out[i - 1][1]));
  return { pts: out, len: L, total: L[L.length - 1] };
});
function trailAt(s) {                                     // point and heading at arc-length share s (0..1)
  const T = TRAIL(), d = clamp(s) * T.total; let i = 1; while (i < T.len.length - 1 && T.len[i] < d) i++;
  const a = T.pts[i - 1], b = T.pts[i], k = (d - T.len[i - 1]) / Math.max(1e-6, T.len[i] - T.len[i - 1]);
  return { x: lerp(a[0], b[0], k), y: lerp(a[1], b[1], k), ang: Math.atan2(b[1] - a[1], b[0] - a[0]) };
}
const STATIONS = [0.22, 0.47, 0.70, 0.90];
const OLIVES = [[0.13, 0.25, 0.085, 1], [-0.2, 0.56, 0.075, 2], [0.36, 0.22, 0.06, 3], [-0.38, -0.08, 0.065, 4]];
const GRASS = lazy(() => { const r = rng(5); return Array.from({ length: 900 }, () => [-0.42 + r() * 0.84, -0.3 + r() * 1.05, r(), r()]); });

// green = how far spring has reached along the trail (0..1, the payoff); autumn = dry tone strength
function drawPlan(g, t, o = {}) {
  const { headS = 0, greenS = 0, showMed = [0, 0, 0, 0] } = o;
  // sea beyond the villa: turquoise band with travelling wave marks
  g.fillStyle = PALETTE.sea; g.fillRect(-0.8, -1.4, 1.6, 0.66);
  for (let i = 0; i < 26; i++) {
    const x = -0.6 + ((i * 0.137 + t * 0.012) % 1.2), y = -0.98 + (i % 6) * 0.045;
    g.beginPath(); g.arc(x, y, 0.018, Math.PI * 1.1, Math.PI * 1.9); g.strokeStyle = '#8FD0D2'; g.lineWidth = 0.003; g.stroke();
  }
  // stone terrace and boundary plot
  cel(g, t, 3, rr(-0.5, -0.74, 1.0, 1.62, 0.02), PALETTE.stone);
  // lawn: dry autumn plate that turns green where spring has reached
  const lawnPath = rr(-0.43, -0.31, 0.86, 1.08, 0.05);
  cel(g, t, 4, lawnPath, mixHex(PALETTE.lawnDry, PALETTE.lawn, o.lawnGreen ?? 0.15));
  // mowing stripes, lighter and darker plates
  g.save(); g.beginPath(); lawnPath(g); g.clip();
  for (let i = 0; i < 12; i++) { g.fillStyle = i % 2 ? 'rgba(255,248,220,0.07)' : 'rgba(60,70,20,0.05)'; g.fillRect(-0.45, -0.31 + i * 0.09, 0.9, 0.09); }
  for (const [x, y, a, b] of GRASS()) {                     // grass ticks: short ink flicks, sway on twos
    const sw = 0.004 * Math.sin(twos(t) * 3 + b * 6);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + sw + (a - 0.5) * 0.006, y - 0.009 - b * 0.006);
    g.strokeStyle = 'rgba(43,38,34,0.28)'; g.lineWidth = 0.0016; g.stroke();
  }
  g.restore();
  inked(g, t, 5, lawnPath, 0.0034);
  // the trail: two rails (mower wheel lines) and sleepers (cut stripes) drawn up to the gardener; spring green behind greenS
  const T = TRAIL(), dHead = headS * T.total;
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  for (let i = 1; i < T.pts.length && T.len[i] <= dHead; i++) {
    const a = T.pts[i - 1], b = T.pts[i], s = T.len[i] / T.total, nx = -(b[1] - a[1]), ny = b[0] - a[0], nl = Math.hypot(nx, ny) || 1;
    const green = s <= greenS;
    g.fillStyle = 'rgba(0,0,0,0)';
    g.strokeStyle = green ? '#8FBF4E' : '#9C8B45'; g.lineWidth = 0.034;
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
    for (const side of [-1, 1]) {
      g.strokeStyle = PALETTE.ink; g.lineWidth = 0.0026;
      g.beginPath(); g.moveTo(a[0] + side * nx / nl * 0.017, a[1] + side * ny / nl * 0.017); g.lineTo(b[0] + side * nx / nl * 0.017, b[1] + side * ny / nl * 0.017); g.stroke();
    }
    if (i % 5 === 0) {                                      // sleepers: a short cross stripe every few steps
      g.strokeStyle = green ? '#5E8A2E' : 'rgba(43,38,34,0.55)'; g.lineWidth = 0.004;
      g.beginPath(); g.moveTo(b[0] - nx / nl * 0.015, b[1] - ny / nl * 0.015); g.lineTo(b[0] + nx / nl * 0.015, b[1] + ny / nl * 0.015); g.stroke();
    }
  }
  g.restore();
  // stepping stones from the pool to the gate along the right
  for (let i = 0; i < 7; i++) {
    const x = 0.395 + 0.008 * Math.sin(i * 2.1), y = -0.22 + i * 0.13;
    dropShadow(g, rr(x - 0.022, y - 0.016, 0.044, 0.032, 0.012), 0.004, 0.006, 0.2);
    cel(g, t, 70 + i, rr(x - 0.022, y - 0.016, 0.044, 0.032, 0.012), '#E6DCC6'); inked(g, t, 80 + i, rr(x - 0.022, y - 0.016, 0.044, 0.032, 0.012), 0.002);
  }
  // villa: terracotta hip roof with tile rows; pool with coping and ripples
  const RX = -0.36, RY = -0.66, RW = 0.44, RHt = 0.3;
  dropShadow(g, rr(RX, RY, RW, RHt, 0.004), 0.02, 0.026, 0.25);
  cel(g, t, 10, rr(RX, RY, RW, RHt, 0.004), PALETTE.terra);
  const ridgeY = RY + RHt / 2, inset = RHt / 2;
  g.save(); g.beginPath(); g.moveTo(RX + inset, ridgeY); g.lineTo(RX + RW - inset, ridgeY); g.lineTo(RX + RW, RY + RHt); g.lineTo(RX, RY + RHt); g.closePath();
  g.fillStyle = 'rgba(90,30,10,0.22)'; g.fill(); g.restore();                     // the lower plane faces away from the sun
  g.save(); g.beginPath(); g.moveTo(RX + RW - inset, ridgeY); g.lineTo(RX + RW, RY); g.lineTo(RX + RW, RY + RHt); g.closePath(); g.fillStyle = 'rgba(90,30,10,0.12)'; g.fill(); g.restore();
  g.save(); g.beginPath(); rr(RX, RY, RW, RHt, 0.004)(g); g.clip();
  for (let i = 1; i < 14; i++) { const y = RY + i * RHt / 14; g.beginPath(); g.moveTo(RX, y); g.lineTo(RX + RW, y); g.strokeStyle = 'rgba(70,25,10,0.28)'; g.lineWidth = 0.0018; g.stroke(); }
  g.restore();
  inked(g, t, 11, (g) => { g.moveTo(RX, RY + RHt); g.lineTo(RX + inset, ridgeY); g.lineTo(RX + RW - inset, ridgeY); g.lineTo(RX + RW, RY + RHt);
    g.moveTo(RX, RY); g.lineTo(RX + inset, ridgeY); g.moveTo(RX + RW, RY); g.lineTo(RX + RW - inset, ridgeY); }, 0.0028);
  inked(g, t, 12, rr(RX, RY, RW, RHt, 0.004), 0.0036);
  // chimney
  dropShadow(g, rr(RX + 0.07, RY + 0.05, 0.035, 0.035, 0.004), 0.008, 0.01, 0.3);
  cel(g, t, 13, rr(RX + 0.07, RY + 0.05, 0.035, 0.035, 0.004), '#F4EEDF'); inked(g, t, 14, rr(RX + 0.07, RY + 0.05, 0.035, 0.035, 0.004), 0.0024);
  const PX = 0.13, PY = -0.64, PW = 0.27, PH = 0.2;
  cel(g, t, 15, rr(PX - 0.018, PY - 0.018, PW + 0.036, PH + 0.036, 0.03), '#F4EEDF');
  cel(g, t, 16, rr(PX, PY, PW, PH, 0.022), PALETTE.sea);
  g.save(); g.beginPath(); rr(PX, PY, PW, PH, 0.022)(g); g.clip();
  for (let i = 0; i < 9; i++) {
    const x = PX + 0.03 + (i % 3) * 0.085 + 0.01 * Math.sin(t * 1.3 + i), y = PY + 0.04 + Math.floor(i / 3) * 0.06 + 0.006 * Math.cos(t * 1.1 + i);
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 0.02, y - 0.012, x + 0.04, y); g.strokeStyle = '#A8E0DF'; g.lineWidth = 0.003; g.stroke();
  }
  g.restore();
  inked(g, t, 17, rr(PX, PY, PW, PH, 0.022), 0.003); inked(g, t, 18, rr(PX - 0.018, PY - 0.018, PW + 0.036, PH + 0.036, 0.03), 0.0024);
  // white boundary wall with the gate gap at the bottom
  g.save(); g.strokeStyle = '#FBF7EC'; g.lineWidth = 0.022; g.lineCap = 'butt';
  g.beginPath(); g.moveTo(-0.055, 0.86); g.lineTo(-0.48, 0.86); g.lineTo(-0.48, -0.72); g.moveTo(0.48, -0.72); g.lineTo(0.48, 0.86); g.lineTo(0.055, 0.86); g.stroke(); g.restore();
  inked(g, t, 19, (g) => { g.moveTo(-0.055, 0.871); g.lineTo(-0.491, 0.871); g.lineTo(-0.491, -0.72); g.moveTo(0.491, -0.72); g.lineTo(0.491, 0.871); g.lineTo(0.055, 0.871); }, 0.003);
  // cypress row along the right wall, swaying a touch
  for (let i = 0; i < 9; i++) {
    const y = -0.4 + i * 0.145, sw = 0.003 * Math.sin(t * 1.6 + i);
    dropShadow(g, disc(0.452 + sw, y, 0.024), 0.008, 0.011, 0.25); cel(g, t, 90 + i, disc(0.452 + sw, y, 0.024), '#3F5E36'); inked(g, t, 100 + i, disc(0.452 + sw, y, 0.024), 0.0022);
  }
  // olive trees: grey-green clusters, a lit plane upper left
  for (const [x, y, r, id] of OLIVES) {

    const outline = (g) => { for (const [bx, by, br] of blobs) { g.moveTo(x + bx * r + br * r * 0.7, y + by * r); g.arc(x + bx * r, y + by * r, br * r * 0.7, 0, TAU); } };

    for (let i = 0; i < 10; i++) { const a = hash1(id * 20 + i) * TAU, d = hash1(id * 30 + i) * r * 0.8; dot(g, S, x + Math.cos(a) * d, y + Math.sin(a) * d, 0.004, '#5C6B3E', 0.7); }
    inked(g, t, 130 + id, outline, 0.0026);

}
// the gardener seen from above: straw-hat disc, terracotta shoulders, arms to the mower handle; held body, arms on twos
function gardenerTop(g, t, x, y, ang, sc = 1) {
  g.save(); g.translate(x, y); g.rotate(ang); g.scale(sc, sc);
  const push = 0.004 * Math.sin(twos(t) * TAU * 1.5);

  dot(g, S, 0.054 + push, 0, 0.011, '#3B4A48');

function fallingLeaves(g, t, span = 3) {
  for (const L of LEAVES()) {
    const ph = ((t - L.t0) % L.fall + L.fall) % L.fall / L.fall, h = 1 - ph;           // h = height above the lawn
    const x = L.x + L.drift * ph + 0.01 * Math.sin(t * 3 + L.t0 * 5), y = L.y + 0.05 * ph;
    const s = L.s * (1 + 0.5 * h), rot = L.spin * t + L.t0;
    g.save(); g.translate(x + 0.03 * h, y + 0.04 * h); g.rotate(rot); g.scale(1, 0.5); g.beginPath(); g.arc(0, 0, s, 0, TAU); g.fillStyle = `rgba(70,52,30,${0.12 + 0.1 * ph})`; g.fill(); g.restore();
    g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s * Math.abs(Math.cos(t * 4 + L.t0 * 3)) * 0.6 + s * 0.3);
    g.beginPath(); g.moveTo(-1, 0); g.quadraticCurveTo(0, -1, 1, 0); g.quadraticCurveTo(0, 1, -1, 0); g.restore();
    g.fillStyle = PALETTE[L.c]; g.fill();
  }
}

function trailBegins(g, k, t, S) {
  // pull-back with counter-rotation, 3 s, ease-out (fastest at frame 0), from the gardener to the whole villa plan
  paperGround(g, S, PALETTE.bg); world(g, S);
  const e = EASE.out(k), headS = lerp(0.07, 0.205, k), p = trailAt(headS);
  const zoom = lerp(3.0, 1.0, e), roll = lerp(25, 0, e) * Math.PI / 180;
  const cx = lerp(p.x, 0, e), cy = lerp(p.y, 0.05, e);
  g.save(); g.rotate(roll); g.scale(zoom, zoom); g.translate(-cx, -cy);
  drawPlan(g, t, { headS, lawnGreen: 0.12, showMed: [MOTION.at(t, CUES.med1, 0.3), 0, 0, 0] });
  gardenerTop(g, t, p.x, p.y, p.ang, 1);
  fallingLeaves(g, t);
  g.restore();
  world(g, S);
  tag(g, t, 'Sonbahar, Ege', 0, -0.62, 0.042, MOTION.at(t, 0.9, 0.3), 62);
}

function rainTurnsDial(g, k, t, S) {

  const hh = HH(), drop = MOTION.back(MOTION.at(t, CUES.s5, 0.3), 1.2);

// a mid-century scene ground: one colour plane and a floor band
function stage(g, S, wall, floor, floorY) {
  paperGround(g, S, wall); world(g, S);
  if (floor) { g.fillStyle = floor; g.fillRect(-0.7, floorY, 1.4, 2); }
}
// a dimension arrow with end ticks, drawn on from the middle out
function dimArrow(g, t, x, y0, y1, k, salt) {
  if (k <= 0) return; const m = (y0 + y1) / 2, e = EASE.out(clamp(k)), a = lerp(m, y0, e), b = lerp(m, y1, e);
  inked(g, t, salt, (g) => { g.moveTo(x, a); g.lineTo(x, b); g.moveTo(x - 0.022, y0); g.lineTo(x + 0.022, y0); g.moveTo(x - 0.022, y1); g.lineTo(x + 0.022, y1); }, 0.0045);
  if (e > 0.6) for (const [yy, d] of [[a, 1], [b, -1]]) { g.beginPath(); g.moveTo(x, yy); g.lineTo(x - 0.013, yy + d * 0.022); g.lineTo(x + 0.013, yy + d * 0.022); g.closePath(); g.fillStyle = PALETTE.ink; g.fill(); }
}
function grassStrip(g, t, y, h, color, n = 60, salt = 1, x0 = -0.62, x1 = 0.62) {
  g.beginPath(); g.moveTo(x0, y + 0.004);
  for (let i = 0; i <= n; i++) { const x = lerp(x0, x1, i / n), sw = 0.004 * Math.sin(twos(t) * 3 + i + salt); g.lineTo(x + sw, y - h * (0.55 + 0.45 * hash1(i * 7 + salt))); g.lineTo(x + (x1 - x0) / n / 2, y); }
  g.lineTo(x1, y + 0.004); g.closePath(); g.fillStyle = color; g.fill();
}

function deckLifts(g, k, t, S) {
  // slow push 4 %, 3.5 s, ease-in-out, on the mower deck; the lever is pulled and the deck rises to 5 cm
  stage(g, S, '#E8D7A2', null, 0);
  const push = lerp(1.0, 1.04, EASE.inOut(k)); g.scale(push, push);
  const lift = MOTION.anticipate(MOTION.at(t, CUES.s2 + 0.6, 0.45), 0.2, 0.3), up = clamp(lift) * 0.07;   // deck height: 3 cm → 5 cm
  const GY = 0.3;                                                                   // the ground line
  // far: a hint of the villa wall and an olive crown against the wall plane
  cel(g, t, 300, rr(-0.7, -0.2, 1.4, 0.18, 0), '#F4EEDF'); inked(g, t, 301, (g) => { g.moveTo(-0.7, -0.2); g.lineTo(0.7, -0.2); g.moveTo(-0.7, -0.02); g.lineTo(0.7, -0.02); }, 0.003);
  cel(g, t, 302, (g) => { g.arc(-0.33, -0.3, 0.12, 0, TAU); g.moveTo(-0.13, -0.27); g.arc(-0.2, -0.27, 0.08, 0, TAU); }, PALETTE.olive); inked(g, t, 303, (g) => { g.arc(-0.33, -0.3, 0.12, 0, TAU); }, 0.003);
  // ground: soil band and uncut grass behind
  g.fillStyle = '#8C6B45'; g.fillRect(-0.7, GY, 1.4, 1.2);
  for (let i = 0; i < 30; i++) dot(g, S, -0.6 + hash1(i) * 1.2, GY + 0.05 + hash1(i + 50) * 0.5, 0.006 + hash1(i + 9) * 0.008, '#74583A', 0.8);
  grassStrip(g, t, GY, 0.11, PALETTE.lawnDry, 70, 3);
  // the cut height under the deck: blades stand at the deck's height, longer as it rises
  const deckX = 0.02, deckW = 0.5, deckY = GY - 0.085 - up;
  grassStrip(g, t, GY, 0.05 + up * 0.95, mixHex(PALETTE.lawnDry, PALETTE.lawn, 0.4), 40, 9, deckX - deckW / 2, deckX + deckW / 2);
  inked(g, t, 304, (g) => { g.moveTo(-0.7, GY); g.lineTo(0.7, GY); }, 0.004);
  // mower: deck shell, wheels below, the handle up to the left with the height lever
  const shell = (g) => { g.moveTo(deckX - deckW / 2, deckY + 0.05); g.lineTo(deckX - deckW / 2 + 0.03, deckY - 0.07); g.lineTo(deckX + deckW / 2 - 0.05, deckY - 0.08); g.quadraticCurveTo(deckX + deckW / 2 + 0.01, deckY - 0.06, deckX + deckW / 2, deckY + 0.05); g.closePath(); };
  dropShadow(g, shell, 0.016, 0.02, 0.22);
  cel(g, t, 305, shell, '#6E8F8C');
  g.save(); g.beginPath(); shell(g); g.clip(); g.fillStyle = 'rgba(20,40,40,0.18)'; g.fillRect(deckX - 0.3, deckY + 0.0, 0.6, 0.06); g.fillStyle = 'rgba(255,255,240,0.18)'; g.fillRect(deckX - 0.3, deckY - 0.08, 0.6, 0.025); g.restore();
  inked(g, t, 306, shell, 0.004);
  text(g, S, 'EGE', deckX + 0.03, deckY - 0.02, 0.04, '#F4EEDF', 1, 0.1, { role: 'display', weight: 400 });
  for (const wx of [deckX - deckW / 2 + 0.07, deckX + deckW / 2 - 0.08]) {
    const wy = GY - 0.045, spin = t * 3;
    // wheel axle drops below the deck as it rises
    inked(g, t, 307, (g) => { g.moveTo(wx, deckY + 0.04); g.lineTo(wx, wy); }, 0.006);
    dropShadow(g, disc(wx, wy, 0.045), 0.008, 0.01, 0.3);
    cel(g, t, 308, disc(wx, wy, 0.045), '#2F3533'); cel(g, t, 309, disc(wx, wy, 0.02), '#B9C2BC'); inked(g, t, 310, disc(wx, wy, 0.045), 0.003);
    g.beginPath(); g.moveTo(wx + Math.cos(spin) * 0.03, wy + Math.sin(spin) * 0.03); g.lineTo(wx - Math.cos(spin) * 0.03, wy - Math.sin(spin) * 0.03); g.strokeStyle = '#5B6461'; g.lineWidth = 0.004; g.stroke();
  }
  const hx = deckX - deckW / 2 + 0.05, hy = deckY - 0.06;
  inked(g, t, 311, (g) => { g.moveTo(hx, hy); g.lineTo(hx - 0.2, hy - 0.42); g.lineTo(hx - 0.26, hy - 0.44); }, 0.009);
  // the height lever: pulled back by the gloved hand, then settles
  const lev = lerp(-0.5, 0.35, clamp(lift)), lx = hx + 0.06, ly = deckY - 0.075;
  g.save(); g.translate(lx, ly); g.rotate(lev);
  inked(g, t, 312, (g) => { g.moveTo(0, 0); g.lineTo(0, -0.14); }, 0.008, PALETTE.terra);
  const glove = (g) => { g.ellipse(0, -0.15, 0.03, 0.026, 0, 0, TAU); for (let f = 0; f < 4; f++) { g.moveTo(0.03, -0.17 + f * 0.012); g.ellipse(0.024, -0.172 + f * 0.012, 0.014, 0.006, 0, 0, TAU); } };
  cel(g, t, 313, glove, PALETTE.mustard); inked(g, t, 314, glove, 0.003);
  g.restore();
  // a sleeve coming in from the left edge to the glove
  // dimension arrow, popping on the cue: blade tip to ground = 5 cm
  dimArrow(g, t, deckX + deckW / 2 + 0.07, GY, GY - 0.05 - up * 0.95, MOTION.at(t, CUES.arrow, 0.35), 315);
  const ak = MOTION.at(t, CUES.arrow + 0.2, 0.3);
  if (ak > 0) { g.save(); g.translate(deckX + deckW / 2 + 0.07, GY - 0.24); const s = MOTION.back(ak, 2.2); g.scale(s, s);
    cel(g, t, 316, rr(-0.085, -0.045, 0.17, 0.09, 0.02), '#FBF6EA'); inked(g, t, 317, rr(-0.085, -0.045, 0.17, 0.09, 0.02), 0.003);
    text(g, S, '5 cm', 0, 0, 0.052, PALETTE.ink, 1, 0, { role: 'display', weight: 400 }); g.restore(); }
  // a few cut clippings jump off the blades as the deck rises
  for (let i = 0; i < 8; i++) { const ph = clamp((t - CUES.s2 - 0.9 - i * 0.04) / 0.6); if (ph <= 0 || ph >= 1) continue;
    const x = deckX - 0.2 + i * 0.05, y = GY - 0.06 - ph * 0.12 + ph * ph * 0.16; dot(g, S, x + ph * 0.05, y, 0.006, '#9CB352', 1 - ph); }
  g.setTransform(S.u, 0, 0, S.u, S.W / 2, S.H / 2);
  medallion(g, t, -0.38, -0.56, 0.05, 1, MOTION.at(t, CUES.s2 + 0.15, 0.3));
  tag(g, t, 'Biçme boyu 5 cm', 0.06, -0.56, 0.042, MOTION.at(t, CUES.s2 + 0.35, 0.3), 320);
}

function soilAerated(g, k, t, S) {
  // truck right, 4.5 s, ease-in-out, with the aerator roller; then the seed spreader pours into the holes
  stage(g, S, '#DCE3C8', null, 0);
  const GY = -0.02, cam = lerp(-0.08, 0.08, EASE.inOut(k)); g.translate(-cam, 0);
  // the soil cross-section: grass on top, two soil layers, roots and stones
  g.fillStyle = '#9C7A52'; g.fillRect(-0.9, GY, 1.9, 0.5); g.fillStyle = '#7E5F3E'; g.fillRect(-0.9, GY + 0.32, 1.9, 1.2);
  inked(g, t, 400, (g) => { g.moveTo(-0.9, GY + 0.32); for (let i = 0; i <= 20; i++) g.lineTo(-0.9 + i * 0.095, GY + 0.32 + 0.012 * Math.sin(i * 1.7)); }, 0.0028);
  for (let i = 0; i < 40; i++) { const x = -0.85 + hash1(i + 400) * 1.8, y = GY + 0.08 + hash1(i + 440) * 0.65; dot(g, S, x, y, 0.006 + hash1(i + 480) * 0.01, i % 3 ? '#6B4F33' : '#B49A74', 0.9); }
  for (let i = 0; i < 26; i++) { const x = -0.85 + i * 0.072; inked(g, t, 410 + i, (g) => { g.moveTo(x, GY); g.quadraticCurveTo(x + 0.02, GY + 0.06, x - 0.01, GY + 0.1 + 0.04 * hash1(i)); }, 0.002, '#E9DDBF'); }
  // the aerator roller travels right and leaves plug holes behind it
  const rx = lerp(-0.5, 0.42, EASE.inOut(MOTION.at(t, CUES.s3 + 0.1, 2.6)));
  const holes = 16;
  for (let i = 0; i < holes; i++) {
    const hx = -0.62 + i * 0.075; if (hx > rx - 0.03) continue;
    const seedIn = clamp((t - CUES.s3 - 2.6 - i * 0.07) / 0.5);
    cel(g, t, 430 + i, rr(hx - 0.012, GY - 0.005, 0.024, 0.11, 0.012), '#4E3826');
    if (seedIn > 0) { for (let j = 0; j < 3; j++) dot(g, S, hx - 0.006 + j * 0.006, GY + 0.08 - j * 0.02 * seedIn, 0.0055, PALETTE.mustard, 1); }
    const sprout = clamp((t - CUES.s3 - 3.6 - i * 0.04) / 0.5);
    if (sprout > 0) inked(g, t, 450 + i, (g) => { g.moveTo(hx, GY + 0.02); g.quadraticCurveTo(hx + 0.012, GY - 0.03 * sprout, hx + 0.005, GY - 0.06 * sprout); }, 0.004, '#5E9A33');
  }
  grassStrip(g, t, GY, 0.07, mixHex(PALETTE.lawnDry, PALETTE.lawn, 0.3), 80, 5, -0.9, 1.0);
  inked(g, t, 401, (g) => { g.moveTo(-0.9, GY); g.lineTo(1.0, GY); }, 0.004);
  // the roller with spikes, spinning as it rolls
  const RY = GY - 0.07, R = 0.085, spin = rx / R;
  dropShadow(g, disc(rx, RY, R), 0.012, 0.016, 0.25);
  for (let i = 0; i < 10; i++) { const a = spin + i * TAU / 10; inked(g, t, 460, (g) => { g.moveTo(rx + Math.cos(a) * R, RY + Math.sin(a) * R); g.lineTo(rx + Math.cos(a) * (R + 0.04), RY + Math.sin(a) * (R + 0.04)); }, 0.007); }
  cel(g, t, 461, disc(rx, RY, R), PALETTE.terra); cel(g, t, 462, disc(rx, RY, R * 0.35), '#F4EEDF'); inked(g, t, 463, disc(rx, RY, R), 0.004);
  inked(g, t, 464, (g) => { g.moveTo(rx, RY); g.lineTo(rx - 0.22, RY - 0.4); g.lineTo(rx - 0.29, RY - 0.41); }, 0.008);
  // the seed spreader: a hopper above the holes, seeds falling in a fan on the second half
  const sk = MOTION.at(t, CUES.s3 + 2.3, 0.4);
  if (sk > 0) {
    const sx = lerp(-0.7, -0.2, EASE.out(MOTION.at(t, CUES.s3 + 2.3, 1.8))) + 0.0, sy = -0.42;
    const hop = (g) => { g.moveTo(sx - 0.09, sy - 0.08); g.lineTo(sx + 0.09, sy - 0.08); g.lineTo(sx + 0.03, sy + 0.04); g.lineTo(sx - 0.03, sy + 0.04); g.closePath(); };
    g.save(); g.globalAlpha = clamp(sk * 2); dropShadow(g, hop, 0.012, 0.016, 0.25); cel(g, t, 470, hop, PALETTE.mustard); inked(g, t, 471, hop, 0.0035);
    text(g, S, 'TOHUM', sx, sy - 0.035, 0.024, PALETTE.ink, 1, 0.1, { role: 'text', weight: 600 }); g.restore();
    for (let i = 0; i < 40; i++) { const ph = (t * 1.8 + hash1(i + 500)) % 1, x = sx + (hash1(i + 520) - 0.5) * 0.12 * (0.4 + ph) * 2.4, y = sy + 0.05 + ph * (GY - sy - 0.05);
      dot(g, S, x, y, 0.005, '#C99A2E', clamp(sk * 2) * (1 - ph * 0.3)); }
  }
  g.setTransform(S.u, 0, 0, S.u, S.W / 2, S.H / 2);
  medallion(g, t, -0.38, -0.56, 0.05, 2, MOTION.at(t, CUES.s3 + 0.25, 0.3));
  tag(g, t, 'Havalandır, tohumla', 0.06, -0.56, 0.042, MOTION.at(t, CUES.s3 + 0.45, 0.3), 480);
}

const RAKE_LEAVES = lazy(() => { const r = rng(21); return Array.from({ length: 70 }, () => ({ x: -0.5 + r() * 1.0, y: -0.45 + r() * 0.85, a: r() * TAU, s: 0.018 + r() * 0.014, c: r() < 0.55 ? 'mustard' : 'terra' })); });
function leavesRaked(g, k, t, S) {
  // cut on the beat; tilt down with the rake, 2.5 s: the rake sweeps leaves into a pile and the lawn under them greens
  stage(g, S, PALETTE.lawnDry, null, 0);
  const tilt = lerp(0.06, -0.04, EASE.out(k)); g.translate(0, tilt);
  const sweep = EASE.inOut(MOTION.at(t, CUES.s4 + 0.15, 1.9));          // 0..1: the swept band moves down the frame
  const bandY = lerp(-0.6, 0.45, sweep);
  // lawn close: big blade tufts; the swept part (above the rake) turns green
  g.save(); g.beginPath(); g.rect(-0.7, -1.2, 1.4, bandY + 1.2); g.fillStyle = mixHex(PALETTE.lawnDry, PALETTE.lawn, 0.85); g.fill(); g.restore();
  for (let i = 0; i < 160; i++) { const x = -0.55 + hash1(i + 600) * 1.1, y = -0.8 + hash1(i + 640) * 1.6, sw = 0.006 * Math.sin(twos(t) * 3 + i);
    inked(g, t, 600, (g) => { g.moveTo(x, y); g.lineTo(x + sw - 0.006, y - 0.03); g.moveTo(x + 0.006, y); g.lineTo(x + sw + 0.01, y - 0.026); }, 0.0024, y < bandY ? '#3F6B2A' : 'rgba(43,38,34,0.45)'); }
  // leaves: those the rake has reached ride with it into the pile at the bottom right
  const pileX = 0.22, pileY = 0.52;
  for (const L of RAKE_LEAVES()) {
    let x = L.x, y = L.y, a = L.a;
    if (L.y < bandY) { const q = clamp((bandY - L.y) / 0.25); x = lerp(L.x, pileX + (L.x - pileX) * 0.25, q); y = lerp(L.y, Math.min(bandY + 0.02, pileY + (L.y - pileY) * 0.12), q); a += q * 2; }
    g.save(); g.translate(x, y); g.rotate(a); dropShadow(g, (g) => g.ellipse(0, 0, L.s, L.s * 0.55, 0, 0, TAU), 0.006, 0.008, 0.25);
    g.beginPath(); g.moveTo(-L.s, 0); g.quadraticCurveTo(0, -L.s * 0.9, L.s, 0); g.quadraticCurveTo(0, L.s * 0.9, -L.s, 0); g.fillStyle = PALETTE[L.c]; g.fill();
    g.beginPath(); g.moveTo(-L.s, 0); g.lineTo(L.s, 0); g.strokeStyle = 'rgba(43,38,34,0.5)'; g.lineWidth = 0.0018; g.stroke(); g.restore();
  }
  // the rake: a fan of tines across the frame on the band, its handle up to the top
  const rakeX = lerp(-0.1, 0.12, sweep), wob = 0.02 * Math.sin(t * 9) * (sweep > 0 && sweep < 1 ? 1 : 0);
  g.save(); g.translate(rakeX + wob, bandY);
  inked(g, t, 610, (g) => { for (let i = 0; i <= 12; i++) { const a = (-150 + i * 10) * Math.PI / 180; g.moveTo(0, -0.04); g.lineTo(Math.cos(a) * 0.2, 0.02 + Math.abs(Math.sin(a)) * 0.0); } }, 0.004);
  inked(g, t, 611, (g) => { g.moveTo(-0.2, 0.02); g.quadraticCurveTo(0, -0.05, 0.2, 0.02); }, 0.005);
  dropShadow(g, rr(-0.012, -1.2, 0.024, 1.16, 0.01), 0.012, 0.0, 0.2);
  cel(g, t, 612, rr(-0.012, -1.2, 0.024, 1.16, 0.01), '#B98A52'); inked(g, t, 613, rr(-0.012, -1.2, 0.024, 1.16, 0.01), 0.003);
  g.restore();
  g.setTransform(S.u, 0, 0, S.u, S.W / 2, S.H / 2);
  medallion(g, t, -0.38, -0.56, 0.05, 3, MOTION.at(t, CUES.s4 + 0.1, 0.3));
  tag(g, t, 'Yaprakları topla', 0.06, -0.56, 0.042, MOTION.at(t, CUES.s4 + 0.3, 0.3), 620);
}

function springArrives(g, k, t, S) {
  // pull-back settle, 0.5 s, then the trail greens end to end; iris-out onto the gate and the end card holds still
  const greenS = EASE.inOut(MOTION.at(t, CUES.green, 0.55)), lawnGreen = lerp(0.15, 1, EASE.inOut(MOTION.at(t, CUES.green + 0.1, 0.5)));
  const irisK = EASE.in(MOTION.at(t, CUES.logo + 0.1, 0.45)), gate = { x: 0, y: 0.86 };
  // the end card under everything: lawn green ground, sunburst, the name
  paperGround(g, S, PALETTE.lawn); world(g, S);
  const card = MOTION.at(t, CUES.logo + 0.35, 0.35);
  g.save(); g.rotate(t * 0.04); for (let i = 0; i < 30; i++) { const a = i * TAU / 30; g.beginPath(); g.moveTo(0, -0.08); g.arc(0, -0.08, 1.4, a, a + TAU / 60); g.closePath(); g.fillStyle = 'rgba(240,248,200,0.10)'; g.fill(); } g.restore();
  if (card > 0) {
    const s = MOTION.back(card, 1.6);
    g.save(); g.translate(0, -0.1); g.scale(s, s);
    g.save(); g.translate(0.007, 0.007); text(g, S, 'Ege Peyzaj', 0, 0, 0.13, PALETTE.mustard, 1, 0, { role: 'display', weight: 400 }); g.restore();
    text(g, S, 'Ege Peyzaj', 0, 0, 0.13, '#FBF6EA', 1, 0, { role: 'display', weight: 400 });
    g.restore();
    // the trail motif under the name: rails with sleepers, ending in a dot
    const lk = EASE.out(MOTION.at(t, CUES.logo + 0.5, 0.5));
    inked(g, t, 700, (g) => { g.moveTo(-0.3, 0.04); g.lineTo(lerp(-0.3, 0.3, lk), 0.04); g.moveTo(-0.3, 0.07); g.lineTo(lerp(-0.3, 0.3, lk), 0.07); }, 0.004, '#FBF6EA');
    for (let i = 0; i < 13; i++) { const x = -0.29 + i * 0.048; if (x > lerp(-0.3, 0.3, lk)) break; inked(g, t, 701 + i, (g) => { g.moveTo(x, 0.035); g.lineTo(x, 0.075); }, 0.004, '#FBF6EA'); }
    if (lk >= 1) dot(g, S, 0.31, 0.055, 0.016, PALETTE.mustard);
    const tl = MOTION.at(t, CUES.logo + 0.8, 0.4);
    g.save(); g.globalAlpha = clamp(tl); g.translate(0, 0.17 + (1 - clamp(tl)) * 0.02);
    text(g, S, 'Baharda yeşili siz görün.', 0, 0, 0.048, '#FBF6EA', 1, 0, { role: 'text', weight: 600 }); g.restore();
  }
  // the plan on top, inside the closing iris
  const r = lerp(2.2, 0, irisK);
  if (r > 0.002) {
    g.save(); const cx = lerp(0, gate.x, irisK), cy = lerp(0.05, gate.y, irisK);
    g.beginPath(); g.arc(gate.x * 1 - 0.0, gate.y - 0.05, r, 0, TAU); g.clip();
    paperGround(g, S, PALETTE.bg); world(g, S);
    g.beginPath(); g.arc(gate.x, gate.y - 0.05, r, 0, TAU); g.clip();
    g.translate(0, -0.05);
    drawPlan(g, t, { headS: 1, greenS, lawnGreen, showMed: [1, 1, 1, 1] });
    const p = trailAt(0.995); gardenerTop(g, t, p.x, p.y - 0.03, -Math.PI / 2, 1);
    // a ring of spring sparkles that travels down the trail with the green
    for (let i = 0; i < 6; i++) { const q = trailAt(clamp(greenS - i * 0.02)); if (greenS > 0 && greenS < 1) star4(g, q.x + 0.03 * Math.cos(i * 2), q.y + 0.03 * Math.sin(i * 2), 0.014, '#FBF6EA', t * 4 + i); }
    g.restore();
    world(g, S);
    if (r < 2) inked(g, t, 720, disc(gate.x, gate.y - 0.05 - 0.05 + 0.05, r), 0.006);
  }
}

// Music: West-Coast cool jazz in code, 120 BPM, swung: walking bass, brushes, vibraphone chords (one per station),
// flute-like lead on the payoff, up a step at 16.0 (F → G), ending on a held major seventh.
function score(ctx, out) {
  const prog = ['Fmaj7', 'Dm7', 'Gm7', 'C7'], progUp = ['Gmaj7', 'Em7', 'Am7', 'D7'];
  const chordOf = (t) => (t < CUES.s6 ? chordAt(prog, t, 1, 0) : chordAt(progUp, t, 1, CUES.s6));
  // walking bass: four notes a bar from the chord tones, pizzicato-like (short, low-passed)
  for (const t of beats('bass')) {

      faces++;
      if ((xx + yy) % 2) continue;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        let best = 0, edge = false;
        for (let d = 1; d <= R; d++) {
          const nx = xx + dx * d, ny = yy + dy * d;
          if (nx < 0 || ny < 0 || nx >= bw || ny >= bh) break;
          if (!edge && face(nx, ny)) continue;
          edge = true;
          const k = (ny * bw + nx) * 4, lb = lum(after[k], after[k + 1], after[k + 2]);
          best = Math.max(best, (Math.max(li, lb) + 0.05) / (Math.min(li, lb) + 0.05));
        }
        if (edge) { all++; if (best < 2) low++; }
      }
    }
    const share = faces > 0.7 * bw * bh ? 100 : all >= 20 ? Math.round((100 * low) / all) : 0;
    if (share >= 50) found.push({ kind: 'contrast', run: st.run, share });
  }
  P.fillText = watch(P.fillText, false);
  P.strokeText = watch(P.strokeText, true);
  window.textCheck = (frame) => {
    frameStart = calls.length; found = []; window.renderFrame(frame);
    if (calls.length > frameStart) settle(calls[calls.length - 1].stack);
    const out = new Map();                       // one finding per line pair (overlap) or line (contrast), the worst kept
    for (const f of found) {
      const r = f.kind === 'overlap' ? { kind: 'overlap', a: f.a.label, b: f.b.label, px: f.px } : { kind: 'contrast', s: f.run.label, share: f.share };
      if (r.kind === 'overlap' && r.a === r.b) continue;
      const key = r.kind === 'overlap' ? [r.a, r.b].sort().join('\u0000') : 'c\u0000' + r.s, old = out.get(key);
      if (!old || (r.px ?? r.share) > (old.px ?? old.share)) out.set(key, r);
    }
    return [...out.values()];
  };
}

// Preview in a normal browser: click renders the soundtrack offline and plays picture and sound together.
// The audio clock picks the frame; nothing is fed back into the render.
if (!q.get('capture')) {
  let frame = 0, playing = false, audio = null, src = null, t0 = 0, offset = 0;
  const hud = document.getElementById('hud');
  const stop = () => { if (src) { src.stop(); src = null; } playing = false; };
  const play = async () => {
    audio ??= new AudioContext();
    const buf = await window.renderAudio();
    src = audio.createBufferSource(); src.buffer = buf; src.connect(audio.destination);
    offset = frame / FPS; t0 = audio.currentTime; src.start(0, offset); playing = true;
    src.onended = () => { if (playing) { playing = false; frame = 0; } };
  };
  addEventListener('click', () => (playing ? stop() : play()));
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') playing ? stop() : play();
    if (e.code === 'ArrowRight') { stop(); frame = Math.min(FRAMES - 1, frame + 1); }
    if (e.code === 'ArrowLeft') { stop(); frame = Math.max(0, frame - 1); }
  });
  const loop = () => {
    if (playing) frame = Math.min(FRAMES - 1, Math.floor((audio.currentTime - t0 + offset) * FPS));
    window.renderFrame(frame);
    hud.textContent = `${TITLE} · frame ${frame}/${FRAMES - 1} · t=${(frame / FPS).toFixed(2)}s · ${playing ? 'playing' : 'click to play with sound'}`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
